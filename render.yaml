services:
  - type: web
    name: abdullah-al-maksud-server
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: BUN_VERSION
        value: 1.3.13
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: abdullahalmaksud
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
